<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wetter-App</title>
  <link href="styles.css" rel="stylesheet" />
</head>
<body>
  <main>
    <section id="weather-wrapper">
      <h1>Wetter-App</h1>

      <form id="weather-search">
        <input
          id="search"
          type="text"
          placeholder="Stadt suchen, z. B. Heilbronn"
          autocomplete="off"
          aria-label="Stadtname"
        />
        <button id="submit" type="submit">Suchen</button>
      </form>

      <div id="weather-data" hidden aria-live="polite"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
